<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>AIRTRACE</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header id="app-header">
    <div id="header-content">
      <img src="Airtracelogo.png" alt="Logo" id="logo" />
      <div>
        <h1>AIRTRACE</h1>
        <p>Click points on the map to see its designated Air Quality.</p>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <button id="locate-btn" aria-label="Find my location">📍</button>

  <!-- Legend -->
  <button id="legend-toggle" aria-label="Toggle legend">AQI</button>
  <div id="legend">
    <h3>AQI Legend</h3>
    <div><span class="dot" style="background:#00e400"></span> Good (0-50)</div>
    <div><span class="dot" style="background:#ffff00"></span> Moderate (51-100)</div>
    <div><span class="dot" style="background:#ff7e00"></span> Unhealthy for Sensitive Groups (101-150)</div>
    <div><span class="dot" style="background:#ff0000"></span> Unhealthy (151-200)</div>
    <div><span class="dot" style="background:#8f3f97"></span> Very Unhealthy (201-300)</div>
    <div><span class="dot" style="background:#7e0023"></span> Hazardous (301+)</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="app.js"></script>
</body>
</html>
